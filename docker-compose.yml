services:
  db:
    image: postgres:15-alpine
    container_name: ledgerbud_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgerbud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerbud"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ledgerbud_web
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ledgerbud
      - FASTAPI_BASE_URL=http://localhost:8000
      - AUTO_CREATE_TABLES=true
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
